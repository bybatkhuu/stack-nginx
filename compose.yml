services:
  certbot:
    image: bybatkhuu/certbot:3.1.4-260804
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      CERTBOT_DOMAINS: ${CERTBOT_DOMAINS}
      CERTBOT_DNS_TIMEOUT: ${CERTBOT_DNS_TIMEOUT:-30}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/secrets/certbot/credentials:/root/.secrets/certbot"
      - "./volumes/secrets/certbot/ssl:/etc/letsencrypt"
      - "./volumes/storage/nginx/www/.well-known/acme-challenge:/var/www/.well-known/acme-challenge"
    network_mode: host
    tty: true

  nginx:
    image: bybatkhuu/nginx:3.3.2-260804
    depends_on:
      - certbot
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/secrets/certbot/ssl:/etc/nginx/ssl"
      - "./volumes/configs/nginx/templates:/etc/nginx/templates"
      - "./volumes/configs/nginx/sites-enabled:/etc/nginx/sites-enabled"
      - "./volumes/storage/nginx/logs:/var/log/nginx"
      - "./volumes/storage/nginx/www:/var/www"
    network_mode: host
    command: ["--https=lets"]
    tty: true
