services:
  certbot:
    image: bybatkhuu/certbot:3.2.0-261021
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?}
      CERTBOT_DOMAINS: "${CERTBOT_DOMAINS:?}"
      CERTBOT_DNS_TIMEOUT: ${CERTBOT_DNS_TIMEOUT:-30}
    volumes:
      - "./volumes/secrets/certbot/credentials:/root/.secrets/certbot"
      - "./volumes/secrets/certbot/ssl:/etc/letsencrypt"
      - "./volumes/storage/nginx/www/.well-known/acme-challenge:/var/www/.well-known/acme-challenge"
    network_mode: host
    tty: true
  nginx:
    image: bybatkhuu/nginx:3.6.1-261120
    depends_on:
      - certbot
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER:?}
      NGINX_BASIC_AUTH_PASS: "${NGINX_BASIC_AUTH_PASS:?}"
    volumes:
      - "./volumes/secrets/certbot/ssl:/etc/nginx/ssl"
      - "./volumes/configs/nginx/templates:/etc/nginx/templates"
      - "./volumes/configs/nginx/sites-enabled:/etc/nginx/sites-enabled"
      - "./volumes/storage/nginx/logs:/var/log/nginx"
      - "./volumes/storage/nginx/www:/var/www"
    network_mode: host
    command: ["--https=lets"]
    tty: true
  cron:
    image: humblebeeai/cron:2.0.0-261024
    restart: always
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # - "/var/run/docker.sock:/var/run/docker.sock"
      - "./volumes/configs/cron/scripts:/app/cron/scripts/custom"
      - "./volumes/configs/cron/cron.d:/app/cron/configs/cron.d"
      - "./volumes/configs/cron/periodic:/app/cron/scripts/periodic"
      - "./volumes/storage/cron/logs:/var/log/cron"
      - "./volumes/secrets:/var/lib/secrets"
      - "./volumes/storage:/var/lib/storage"
      - "./volumes/backups:/var/lib/backups"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    tty: true
